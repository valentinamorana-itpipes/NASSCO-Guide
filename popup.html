<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NASSCO PACP Guide</title>
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>
  <header id="app-header">
    <button id="back-btn" class="icon-btn" aria-label="Back" hidden>&#8592;</button>
    <div id="header-titles">
      <h1 id="header-title">NASSCO PACP Guide</h1>
      <p id="header-subtitle">Pick a pipe behavior to get started</p>
    </div>
  </header>

  <div id="search-bar">
    <input id="search-input" type="text" placeholder="Search a code, material, or keyword…" autocomplete="off" />
  </div>

  <div id="version-bar" class="codes-cat" hidden>
    <span id="version-bar-label">Version:</span>
    <div id="version-bar-buttons" role="group" aria-label="PACP version filter">
      <button type="button" class="version-btn" data-v="v6">V6</button>
      <button type="button" class="version-btn" data-v="v7">V7</button>
      <button type="button" class="version-btn" data-v="both">Both</button>
    </div>
  </div>

  <main id="app-main"></main>

  <footer id="app-footer" hidden>
    <span>Want to edit or add something?</span>
    <a href="https://itpipes.slack.com/archives/C0BUTN9MN82" target="_blank" rel="noopener noreferrer">Tell us on Slack</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
